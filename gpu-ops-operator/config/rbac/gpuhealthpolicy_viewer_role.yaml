# This rule is not used by the project gpu-ops-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ops.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: gpu-ops-operator
    app.kubernetes.io/managed-by: kustomize
  name: gpuhealthpolicy-viewer-role
rules:
- apiGroups:
  - ops.example.com
  resources:
  - gpuhealthpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ops.example.com
  resources:
  - gpuhealthpolicies/status
  verbs:
  - get
