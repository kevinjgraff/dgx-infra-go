apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: pushgateway }
  template:
    metadata:
      labels: { app: pushgateway }
    spec:
      containers:
      - name: pushgateway
        # Official image; v1.11.1 is a recent stable tag
        image: prom/pushgateway:v1.11.1
        args:
          - --web.listen-address=:9091
        ports:
          - name: http
            containerPort: 9091
        readinessProbe:
          httpGet: { path: /-/ready, port: 9091 }
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /-/healthy, port: 9091 }
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: observability
spec:
  selector: { app: pushgateway }
  ports:
    - name: http
      port: 9091
      targetPort: 9091
      protocol: TCP

